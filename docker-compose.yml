services:
  bot:
    build: .
    restart: on-failure
    stdin_open: true
    tty: true
    env_file: .env
    secrets:
      - discord_token
      - database_url
      - deepseek_api_key
    volumes:
      - ./data:/app/data

secrets:
  discord_token:
    file: ./secrets/discord_token
  database_url:
    file: ./secrets/database_url
  deepseek_api_key:
    file: ./secrets/deepseek_api_key
